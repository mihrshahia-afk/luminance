<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1a1a1a; display: flex; justify-content: center; gap: 60px; padding: 60px; font-family: 'Georgia', serif; }
  .temple { text-align: center; }
  .temple svg { filter: drop-shadow(0 0 15px rgba(201,168,76,0.3)); }
  .temple p { color: #C9A84C; font-size: 12px; margin-top: 16px; letter-spacing: 0.05em; }
</style>
</head>
<body>

<div class="temple">
  <!-- LOTUS TEMPLE — Aerial view: 9 pointed petals radiating from centre, pools between -->
  <svg viewBox="0 0 260 220" width="280" height="240">
    <!-- Outer pools (the triangular water features between petals) -->
    <ellipse cx="130" cy="185" rx="100" ry="18" fill="#C9A84C" opacity="0.06"/>

    <!-- 9 outer "leaf" petals lying flat, radiating outward like a star -->
    <!-- These are the access/entry petals seen from above -->
    <path d="M130 185 L90 170 Q60 155 50 130 Q55 120 70 125 Q85 130 100 145 Z" fill="#C9A84C" opacity="0.2"/>
    <path d="M130 185 L170 170 Q200 155 210 130 Q205 120 190 125 Q175 130 160 145 Z" fill="#C9A84C" opacity="0.2"/>
    <path d="M130 185 L115 175 Q80 168 55 160 Q50 150 65 148 Q80 148 105 158 Z" fill="#C9A84C" opacity="0.18"/>
    <path d="M130 185 L145 175 Q180 168 205 160 Q210 150 195 148 Q180 148 155 158 Z" fill="#C9A84C" opacity="0.18"/>

    <!-- Side view petals rising up — the iconic pointed shapes -->
    <!-- Centre-left petal -->
    <path d="M130 170 C118 140, 100 90, 95 55 C93 35, 100 18, 110 10 C118 5, 125 3, 130 2
             C135 3, 142 5, 150 10 C160 18, 167 35, 165 55 C160 90, 142 140, 130 170Z"
          fill="#C9A84C" opacity="0.85"/>

    <!-- Left petal -->
    <path d="M130 172 C110 148, 78 105, 65 65 C58 40, 62 22, 75 14 C85 9, 95 12, 100 25
             C105 40, 108 65, 130 172Z"
          fill="#C9A84C" opacity="0.7"/>
    <!-- Right petal (mirror) -->
    <path d="M130 172 C150 148, 182 105, 195 65 C202 40, 198 22, 185 14 C175 9, 165 12, 160 25
             C155 40, 152 65, 130 172Z"
          fill="#C9A84C" opacity="0.7"/>

    <!-- Outer left petal -->
    <path d="M130 175 C100 155, 58 115, 40 72 C32 48, 38 28, 55 18 C65 13, 72 18, 72 32
             C72 48, 85 80, 130 175Z"
          fill="#C9A84C" opacity="0.5"/>
    <!-- Outer right petal -->
    <path d="M130 175 C160 155, 202 115, 220 72 C228 48, 222 28, 205 18 C195 13, 188 18, 188 32
             C188 48, 175 80, 130 175Z"
          fill="#C9A84C" opacity="0.5"/>

    <!-- Far outer left -->
    <path d="M130 178 C90 160, 42 120, 22 80 C14 58, 22 35, 40 25 C50 20, 56 28, 55 42
             C54 58, 72 95, 130 178Z"
          fill="#C9A84C" opacity="0.35"/>
    <!-- Far outer right -->
    <path d="M130 178 C170 160, 218 120, 238 80 C246 58, 238 35, 220 25 C210 20, 204 28, 205 42
             C206 58, 188 95, 130 178Z"
          fill="#C9A84C" opacity="0.35"/>

    <!-- Base podium ring -->
    <ellipse cx="130" cy="175" rx="60" ry="8" fill="#C9A84C" opacity="0.15"/>
    <ellipse cx="130" cy="178" rx="50" ry="6" fill="none" stroke="#C9A84C" stroke-width="0.5" opacity="0.2"/>
  </svg>
  <p>Lotus Temple — New Delhi, India</p>
</div>

<div class="temple">
  <!-- CHILE TEMPLE — 9 translucent torqued wings with criss-cross veining, light between -->
  <svg viewBox="0 0 260 220" width="280" height="240">
    <!-- Base platform -->
    <ellipse cx="130" cy="195" rx="55" ry="8" fill="#C9A84C" opacity="0.12"/>
    <!-- Base columns/supports visible at bottom -->
    <rect x="88" y="175" width="8" height="20" rx="3" fill="#C9A84C" opacity="0.3"/>
    <rect x="108" y="178" width="6" height="17" rx="2" fill="#C9A84C" opacity="0.25"/>
    <rect x="128" y="180" width="5" height="15" rx="2" fill="#C9A84C" opacity="0.2"/>
    <rect x="146" y="178" width="6" height="17" rx="2" fill="#C9A84C" opacity="0.25"/>
    <rect x="164" y="175" width="8" height="20" rx="3" fill="#C9A84C" opacity="0.3"/>

    <!-- Wing panels — wide at middle, narrow at top and bottom -->
    <!-- Each wing is a tall torqued shape bulging in the middle -->

    <!-- Far left wing -->
    <path d="M130 188 C85 165, 35 115, 25 60 C22 38, 32 20, 48 15 C58 12, 62 22, 60 38
             C56 60, 78 110, 130 188Z"
          fill="#C9A84C" opacity="0.3"/>
    <!-- Veining on wing -->
    <path d="M60 38 C65 55, 85 90, 110 140" fill="none" stroke="#1a1a1a" stroke-width="0.4" opacity="0.15"/>
    <path d="M48 30 C58 50, 78 85, 105 130" fill="none" stroke="#1a1a1a" stroke-width="0.3" opacity="0.12"/>

    <!-- Left wing -->
    <path d="M130 185 C95 158, 55 105, 45 55 C42 32, 52 15, 68 10 C78 7, 82 18, 78 35
             C74 58, 95 100, 130 185Z"
          fill="#C9A84C" opacity="0.45"/>
    <path d="M78 35 C82 52, 98 88, 118 145" fill="none" stroke="#1a1a1a" stroke-width="0.4" opacity="0.12"/>

    <!-- Inner left wing -->
    <path d="M130 182 C105 152, 72 98, 65 50 C62 28, 75 12, 90 8 C100 6, 102 16, 98 32
             C94 52, 108 95, 130 182Z"
          fill="#C9A84C" opacity="0.6"/>

    <!-- Centre-left wing -->
    <path d="M130 178 C118 145, 95 85, 90 42 C88 22, 100 8, 114 5 C122 3, 126 12, 124 28
             C120 48, 124 90, 130 178Z"
          fill="#C9A84C" opacity="0.75"/>

    <!-- Centre-right wing (mirror) -->
    <path d="M130 178 C142 145, 165 85, 170 42 C172 22, 160 8, 146 5 C138 3, 134 12, 136 28
             C140 48, 136 90, 130 178Z"
          fill="#C9A84C" opacity="0.75"/>

    <!-- Inner right wing -->
    <path d="M130 182 C155 152, 188 98, 195 50 C198 28, 185 12, 170 8 C160 6, 158 16, 162 32
             C166 52, 152 95, 130 182Z"
          fill="#C9A84C" opacity="0.6"/>

    <!-- Right wing -->
    <path d="M130 185 C165 158, 205 105, 215 55 C218 32, 208 15, 192 10 C182 7, 178 18, 182 35
             C186 58, 165 100, 130 185Z"
          fill="#C9A84C" opacity="0.45"/>
    <path d="M182 35 C178 52, 162 88, 142 145" fill="none" stroke="#1a1a1a" stroke-width="0.4" opacity="0.12"/>

    <!-- Far right wing -->
    <path d="M130 188 C175 165, 225 115, 235 60 C238 38, 228 20, 212 15 C202 12, 198 22, 200 38
             C204 60, 182 110, 130 188Z"
          fill="#C9A84C" opacity="0.3"/>

    <!-- Light gaps between wings -->
    <path d="M130 185 C98 160, 60 108, 52 58" fill="none" stroke="#1a1a1a" stroke-width="2" opacity="0.2"/>
    <path d="M130 182 C108 155, 78 100, 70 52" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.18"/>
    <path d="M130 178 C120 148, 100 88, 95 44" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.15"/>
    <path d="M130 178 C140 148, 160 88, 165 44" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.15"/>
    <path d="M130 182 C152 155, 182 100, 190 52" fill="none" stroke="#1a1a1a" stroke-width="1.5" opacity="0.18"/>
    <path d="M130 185 C162 160, 200 108, 208 58" fill="none" stroke="#1a1a1a" stroke-width="2" opacity="0.2"/>

    <!-- Oculus at top -->
    <circle cx="130" cy="6" r="4" fill="#C9A84C" opacity="0.5"/>
  </svg>
  <p>Temple — Santiago, Chile</p>
</div>

<div class="temple">
  <!-- SYDNEY TEMPLE — Octagonal base, arched windows, prominent dome, pinnacle -->
  <svg viewBox="0 0 260 220" width="280" height="240">
    <!-- Ground / lawn -->
    <rect x="10" y="195" width="240" height="8" rx="3" fill="#C9A84C" opacity="0.05"/>

    <!-- Wide stepped base -->
    <path d="M45 195 L215 195 L210 190 L50 190 Z" fill="#C9A84C" opacity="0.2"/>
    <path d="M50 190 L210 190 L205 185 L55 185 Z" fill="#C9A84C" opacity="0.18"/>

    <!-- Main building body — slightly tapered -->
    <path d="M58 185 L58 115 L202 115 L202 185 Z" fill="#C9A84C" opacity="0.45"/>

    <!-- Large arched windows on front face (3 visible) -->
    <!-- Left window -->
    <path d="M68 185 L68 145 Q68 130 85 125 Q102 130 102 145 L102 185" fill="#1a1a1a" opacity="0.15"/>
    <!-- Decorative tracery inside left window -->
    <circle cx="85" cy="138" r="6" fill="none" stroke="#C9A84C" stroke-width="0.4" opacity="0.2"/>
    <line x1="85" y1="132" x2="85" y2="185" stroke="#C9A84C" stroke-width="0.3" opacity="0.15"/>

    <!-- Centre window (largest) -->
    <path d="M112 185 L112 138 Q112 118 130 112 Q148 118 148 138 L148 185" fill="#1a1a1a" opacity="0.15"/>
    <circle cx="130" cy="128" r="8" fill="none" stroke="#C9A84C" stroke-width="0.4" opacity="0.2"/>
    <line x1="130" y1="120" x2="130" y2="185" stroke="#C9A84C" stroke-width="0.3" opacity="0.15"/>

    <!-- Right window -->
    <path d="M158 185 L158 145 Q158 130 175 125 Q192 130 192 145 L192 185" fill="#1a1a1a" opacity="0.15"/>
    <circle cx="175" cy="138" r="6" fill="none" stroke="#C9A84C" stroke-width="0.4" opacity="0.2"/>
    <line x1="175" y1="132" x2="175" y2="185" stroke="#C9A84C" stroke-width="0.3" opacity="0.15"/>

    <!-- Small upper windows (between main windows and dome) -->
    <path d="M72 125 L72 118 Q72 112 82 110 Q92 112 92 118 L92 125" fill="#1a1a1a" opacity="0.1"/>
    <path d="M108 122 L108 115 Q108 108 118 106 Q128 108 128 115 L128 122" fill="#1a1a1a" opacity="0.1"/>
    <path d="M132 122 L132 115 Q132 108 142 106 Q152 108 152 115 L152 122" fill="#1a1a1a" opacity="0.1"/>
    <path d="M168 125 L168 118 Q168 112 178 110 Q188 112 188 118 L188 125" fill="#1a1a1a" opacity="0.1"/>

    <!-- Cornice / entablature above windows -->
    <rect x="55" y="112" width="150" height="4" rx="1" fill="#C9A84C" opacity="0.55"/>

    <!-- Drum (cylindrical section below dome) -->
    <path d="M62 112 L62 95 Q62 92 65 92 L195 92 Q198 92 198 95 L198 112" fill="#C9A84C" opacity="0.35"/>

    <!-- Small clerestory windows in drum -->
    <path d="M78 108 L78 98 Q78 95 85 94 Q92 95 92 98 L92 108" fill="#1a1a1a" opacity="0.08"/>
    <path d="M118 108 L118 98 Q118 95 130 94 Q142 95 142 98 L142 108" fill="#1a1a1a" opacity="0.08"/>
    <path d="M168 108 L168 98 Q168 95 175 94 Q182 95 182 98 L182 108" fill="#1a1a1a" opacity="0.08"/>

    <!-- Dome band / transition -->
    <rect x="60" y="90" width="140" height="3" rx="1" fill="#C9A84C" opacity="0.5"/>

    <!-- Main dome -->
    <path d="M65 92 Q65 40 130 10 Q195 40 195 92 Z" fill="#C9A84C" opacity="0.55"/>

    <!-- Dome ribs -->
    <path d="M82 92 Q82 48 130 16 Q178 48 178 92" fill="none" stroke="#1a1a1a" stroke-width="0.5" opacity="0.08"/>
    <path d="M98 92 Q98 50 130 20 Q162 50 162 92" fill="none" stroke="#1a1a1a" stroke-width="0.4" opacity="0.06"/>
    <path d="M114 92 Q114 55 130 25 Q146 55 146 92" fill="none" stroke="#1a1a1a" stroke-width="0.3" opacity="0.05"/>

    <!-- Small domes / turrets at corners of drum -->
    <circle cx="65" cy="92" r="5" fill="#C9A84C" opacity="0.3"/>
    <circle cx="195" cy="92" r="5" fill="#C9A84C" opacity="0.3"/>
    <circle cx="65" cy="92" r="5" fill="none" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>
    <circle cx="195" cy="92" r="5" fill="none" stroke="#C9A84C" stroke-width="0.3" opacity="0.2"/>

    <!-- Pinnacle / finial -->
    <line x1="130" y1="10" x2="130" y2="0" stroke="#C9A84C" stroke-width="1.5" opacity="0.7"/>
    <circle cx="130" cy="0" r="2" fill="#C9A84C" opacity="0.8"/>

    <!-- Small pinnacles on corner domes -->
    <line x1="65" y1="87" x2="65" y2="83" stroke="#C9A84C" stroke-width="0.8" opacity="0.4"/>
    <circle cx="65" cy="83" r="1" fill="#C9A84C" opacity="0.5"/>
    <line x1="195" y1="87" x2="195" y2="83" stroke="#C9A84C" stroke-width="0.8" opacity="0.4"/>
    <circle cx="195" cy="83" r="1" fill="#C9A84C" opacity="0.5"/>
  </svg>
  <p>Temple — Sydney, Australia</p>
</div>

</body>
</html>
